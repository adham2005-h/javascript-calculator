<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calculator">
        <div class="display">
            <input type="text" id="result" readonly>
        </div>

        <div class="buttons">
            <button class="btn operator" data-value="C">C</button>
            <button class="btn operator" data-value="DEL">DEL</button>
            <button class="btn operator" data-value="/">/</button>
            <button class="btn operator" data-value="*">*</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="-">-</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="+">+</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="=">=</button>

            <button class="btn zero" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
        </div>
    </div>

    <footer class="footer">
        
        <h3>© Eng. Adham Muayad Hashem</h3>

        <div class="footer-links">
            <a href="https://wa.me/971506702761" target="_blank" rel="noopener noreferrer" title="My WhatsApp">WhatsApp</a>
            <a href="https://github.com/adhammr223-cyber" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="mailto:adham99.h@icloud.com" target="_blank" rel="noopener noreferrer">Email</a>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
